networks:
  rns_telcom:

services:
  rns-telcom-app:
    container_name: rns-telcom-app
    build:
      context: .docker/app
      dockerfile: Dockerfile
      args:
        UID: ${UID:-1001}
        GID: ${GID:-1001}
    volumes:
      - ".:/var/www/rns_telcom"
    env_file:
      - .env.prod
    networks:
      - rns_telcom
    restart: unless-stopped

  rns-telcom-db:
    container_name: rns-telcom-db
    image: postgres:alpine
    volumes:
      - /home/storage/rns_telcom/postgres/:/var/lib/postgresql/data/
    env_file:
      - .env.prod
    command: ["postgres", "-c", "log_statement=ddl"]
    networks:
      - rns_telcom
    restart: unless-stopped

  rns-telcom-nginx:
    container_name: rns-telcom-nginx
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ".:/var/www/rns_telcom"
      - ".docker/nginx/conf.d/rns-telcom-prod.conf.template:/etc/nginx/templates/default.conf.template:ro"
      - "certbot-conf:/etc/letsencrypt"
      - "certbot-www:/var/www/certbot"
    command: /bin/sh -c "envsubst '$${APP_DOMAIN}' < /etc/nginx/templates/default.conf.template > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    depends_on:
      - rns-telcom-app
    env_file:
      - .env.prod
    networks:
      - rns_telcom
    restart: unless-stopped

  certbot:
    container_name: rns-telcom-certbot
    image: certbot/certbot
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped

volumes:
  certbot-conf:
  certbot-www:
